name: partner-agent-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partner_test
      POSTGRES_USER: partner_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U partner_test -d partner_test]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.13.4
    tmpfs: [/qdrant/storage]
  models:
    build:
      context: .
      dockerfile: tests/Dockerfile
    command: [uvicorn, tests.support.model_server:app, --host, 0.0.0.0, --port, '11434', --no-access-log]
  auth:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://partner_test:test-only-password@postgres:5432/partner_test
      ALLOWED_ORIGINS: http://frontend,http://localhost:8080
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build:
      context: .
      dockerfile: services/backend_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://partner_test:test-only-password@postgres:5432/partner_test
      AUTH_URL: http://auth:8002
      RAG_URL: http://rag-service:8001
      ALLOWED_ORIGINS: http://frontend,http://localhost:8080
    depends_on:
      postgres: {condition: service_healthy}
  rag-service:
    build:
      context: .
      dockerfile: tests/Dockerfile
    working_dir: /project/services/rag_service
    environment:
      PYTHONPATH: /project:/project/services/common
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://models:11434
      DATA_DIR: /tmp/rag-data
      ADMIN_TOKEN: local-test-admin
      RERANK_ENABLED: 'false'
    command: [uvicorn, tests.support.rag_app:app, --host, 0.0.0.0, --port, '8001', --no-access-log]
    depends_on: [qdrant, models]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      AGENT_UPSTREAM: http://backend:8000
      RAG_UPSTREAM: http://rag-service:8001
    depends_on: [backend, auth, rag-service]
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://partner_test:test-only-password@postgres:5432/partner_test
      TEST_QDRANT_URL: http://qdrant:6333
      TEST_BASE_URL: http://frontend
    volumes: [./reports:/project/reports]
    command: [python, scripts/stack_checks.py]
    depends_on: [frontend]
