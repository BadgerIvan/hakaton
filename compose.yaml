name: partner-agent

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-partner}:${POSTGRES_PASSWORD:-partner_local_password}@postgres:5432/${POSTGRES_DB:-partner}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_DIR: /app/logs
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}

x-log-policy: &log-policy
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *log-policy
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partner}
      POSTGRES_USER: ${POSTGRES_USER:-partner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partner_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth:
    logging: *log-policy
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    environment:
      <<: *app-environment
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    logging: *log-policy
    build:
      context: .
      dockerfile: services/backend_service/Dockerfile
    environment:
      <<: *app-environment
      AUTH_URL: http://auth:8002
      RAG_URL: http://rag-service:8001
      HISTORY_TURNS: ${HISTORY_TURNS:-10}
      HISTORY_MAX_CHARS: ${HISTORY_MAX_CHARS:-12000}
      GENERATION_TIMEOUT: ${GENERATION_TIMEOUT:-110}
    volumes:
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      rag-service:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    logging: *log-policy
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      AGENT_UPSTREAM: http://backend:8000
      RAG_UPSTREAM: http://rag-service:8001
    ports:
      - '8080:80'
    depends_on:
      auth:
        condition: service_healthy
      backend:
        condition: service_healthy
      rag-service:
        condition: service_started
    restart: unless-stopped

  ollama:
    logging: *log-policy
    image: ollama/ollama:latest
    environment:
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    logging: *log-policy
    image: qdrant/qdrant:v1.13.4
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  rag-service:
    logging: *log-policy
    build:
      context: .
      dockerfile: services/rag_service/Dockerfile
    environment:
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      FASTEMBED_CACHE_PATH: /app/.fastembed_cache
      ADMIN_TOKEN: ${RAG_ADMIN_TOKEN:-change-me-admin-token}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      HISTORY_LIMIT: ${RAG_HISTORY_LIMIT:-6}
      NUM_CTX: ${NUM_CTX:-8192}
      LLM_REASONING: 'false'
      RERANK_THREADS: ${RERANK_THREADS:-2}
    volumes:
      - app_logs:/app/logs
      - rag_data:/app/data
      - fastembed_cache:/app/.fastembed_cache
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  app_logs:
    name: ${LOGS_VOLUME_NAME:-partner-agent_app_logs}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-partner-agent_postgres_data}
  ollama_models:
    name: ${OLLAMA_VOLUME_NAME:-partner-agent_ollama_models}
  qdrant_storage:
    name: ${QDRANT_VOLUME_NAME:-partner-agent_qdrant_storage}
  fastembed_cache:
    name: ${FASTEMBED_VOLUME_NAME:-partner-agent_fastembed_cache}
  rag_data:
    name: ${RAG_DATA_VOLUME_NAME:-partner-agent_rag_data}
